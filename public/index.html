<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SACS Ops — Portal de Atención al Cliente SEAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#09090b',
            surface: '#0c0c0f',
            'surface-container-low': '#0f0f12',
            'surface-container': '#121215',
            'surface-container-high': '#18181b',
            'surface-container-highest': '#1e1e22',
            'outline-variant': '#27272a',
            outline: '#52525b',
            primary: '#a78bfa',
            'primary-container': '#7c3aed',
            tertiary: '#34d399',
            error: '#ef4444',
            secondary: '#71717a',
            'on-surface': '#fafafa',
            'on-surface-variant': '#a1a1aa'
          },
          fontFamily: {
            sans: ['Geist', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/obsidian.css" />
</head>
<body class="bg-background text-on-surface min-h-screen">
  <div id="app-shell" class="min-h-screen flex">
    <!-- Sidebar -->
    <aside
      id="app-sidebar"
      class="fixed inset-y-0 left-0 z-30 w-64 bg-surface border-r border-outline-variant flex flex-col justify-between transition-all duration-200"
    >
      <div>
        <!-- Brand -->
        <div class="h-14 px-4 border-b border-outline-variant flex items-center justify-between">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-primary/15 border border-primary/40 flex items-center justify-center text-primary shrink-0">
              <span class="material-symbols-outlined text-[18px]">bolt</span>
            </div>
            <div class="brand-text truncate">
              <div class="text-xs font-bold tracking-wider uppercase text-on-surface">OPERACIONES</div>
              <div class="text-[10px] text-secondary uppercase tracking-wide">Servicios &amp; Suministros</div>
            </div>
          </div>
          <button id="btn-collapse-sidebar" type="button" title="Colapsar barra" class="text-secondary hover:text-on-surface p-1 rounded cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">menu_open</span>
          </button>
        </div>

        <!-- Navigation -->
        <nav class="p-3 space-y-5">
          <div>
            <div class="sidebar-section-title px-3 mb-2 text-[10px] font-semibold tracking-widest uppercase text-secondary">Principal</div>
            <div class="space-y-1">
              <button data-nav="turnos" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">confirmation_number</span>
                  <span class="sidebar-label">Tablero &amp; Turnos</span>
                </span>
                <span id="badge-turnos" class="sidebar-badge px-1.5 py-0.5 rounded-full text-[10px] font-mono bg-surface-container-high border border-outline-variant text-on-surface-variant">0</span>
              </button>
              <button data-nav="tickets" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">support_agent</span>
                  <span class="sidebar-label">Atención &amp; Tickets</span>
                </span>
                <span id="badge-tickets" class="sidebar-badge px-1.5 py-0.5 rounded-full text-[10px] font-mono bg-surface-container-high border border-outline-variant text-on-surface-variant">0</span>
              </button>
            </div>
          </div>

          <div>
            <div class="sidebar-section-title px-3 mb-2 text-[10px] font-semibold tracking-widest uppercase text-secondary">Gestión</div>
            <div class="space-y-1">
              <button data-nav="clientes" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">electric_meter</span>
                  <span class="sidebar-label">Clientes &amp; Suministros</span>
                </span>
              </button>
              <button data-nav="comprobantes" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">receipt_long</span>
                  <span class="sidebar-label">Comprobantes &amp; Pagos</span>
                </span>
              </button>
              <button data-nav="ots" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">engineering</span>
                  <span class="sidebar-label">Órdenes de Trabajo (OTs)</span>
                </span>
              </button>
              <button data-nav="indicadores" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">monitoring</span>
                  <span class="sidebar-label">Indicadores</span>
                </span>
              </button>
            </div>
          </div>

          <div>
            <div class="sidebar-section-title px-3 mb-2 text-[10px] font-semibold tracking-widest uppercase text-secondary">Datos</div>
            <div class="space-y-1">
              <button data-nav="datos-clientes" class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors cursor-pointer">
                <span class="flex items-center gap-2.5">
                  <span class="material-symbols-outlined text-[18px]">group</span>
                  <span class="sidebar-label">Cliente</span>
                </span>
              </button>
            </div>
          </div>
        </nav>
      </div>

      <!-- Bottom Box Status & Logout -->
      <div class="p-3 border-t border-outline-variant space-y-2">
        <div class="sidebar-footer-content rounded-lg bg-surface-container p-3 border border-outline-variant">
          <div class="flex items-center justify-between text-[11px] mb-2">
            <span class="flex items-center gap-1.5 font-medium text-on-surface">
              <span id="sidebar-box-dot" class="w-2 h-2 rounded-full bg-tertiary"></span>
              <span id="sidebar-box-label">Box Activo</span>
            </span>
            <span id="sidebar-box-timer" class="font-mono text-tertiary">00:00:00</span>
          </div>
          <button
            id="btn-toggle-box"
            type="button"
            class="w-full btn-secondary py-1.5 px-2.5 text-[11px] flex items-center justify-center gap-1.5 cursor-pointer"
          >
            <span class="material-symbols-outlined text-[15px]">pause_circle</span>
            <span id="btn-toggle-box-text">Pausar Puesto</span>
          </button>
        </div>

        <button
          id="btn-logout"
          type="button"
          class="sidebar-nav-item w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs text-on-surface-variant hover:text-red-300 hover:bg-error/10 border border-transparent hover:border-error/30 transition-colors cursor-pointer"
        >
          <span class="material-symbols-outlined text-[17px]">logout</span>
          <span class="sidebar-label">Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div id="main-wrapper" class="flex-1 pl-64 flex flex-col min-w-0 transition-all duration-200">
      <!-- Top Header -->
      <header id="top-header" class="sticky top-0 z-20 h-14 bg-surface/90 backdrop-blur border-b border-outline-variant px-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <div class="flex items-center gap-2 bg-surface-container border border-outline-variant rounded-lg px-3 py-1.5 text-xs">
            <span class="material-symbols-outlined text-[16px] text-secondary">apartment</span>
            <select id="header-sucursal" class="bg-transparent text-on-surface font-medium focus:outline-none cursor-pointer"></select>
          </div>
          <span class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant text-[11px] text-on-surface-variant">
            <span class="w-2 h-2 rounded-full bg-tertiary"></span>
            <span id="header-red-status">Red Operativa Normal (99.1%)</span>
          </span>
        </div>

        <div class="flex items-center gap-3">
          <button
            id="btn-global-refresh"
            type="button"
            title="Sincronizar con PostgreSQL"
            class="p-2 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant hover:text-on-surface cursor-pointer"
          >
            <span class="material-symbols-outlined text-[18px]">sync</span>
          </button>
          <button
            id="btn-theme-toggle"
            type="button"
            title="Alternar Modo Claro / Oscuro"
            class="p-2 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant hover:text-on-surface cursor-pointer"
          >
            <span id="theme-icon" class="material-symbols-outlined text-[18px]">light_mode</span>
          </button>

          <div class="flex items-center gap-2.5 pl-2 border-l border-outline-variant">
            <div class="text-right hidden sm:block">
              <div id="header-user-name" class="text-xs font-semibold text-on-surface">Operador</div>
              <div id="header-user-meta" class="text-[11px] text-tertiary">Ventanilla • Disponible</div>
            </div>
            <div id="header-user-avatar" class="w-8 h-8 rounded-full bg-primary/20 border border-primary/40 flex items-center justify-center text-xs font-bold text-primary">
              OP
            </div>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <main id="main-content" class="flex-1 p-6 max-w-[1600px] w-full mx-auto animate-fade-in">
        <div class="py-16 text-center text-xs text-secondary">Cargando módulo operativo...</div>
      </main>
    </div>
  </div>

  <!-- Modal Root -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4"></div>

  <!-- Toast Root -->
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Printable Document Sheet -->
  <div id="print-sheet"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
